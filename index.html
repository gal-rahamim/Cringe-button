<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Cringe Button</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg: #140f1a; --fg: #f4eef8; --muted: #9a8fa6; --btn: #ff2d55; --btn-dark: #b3123a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  main { height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 28px; padding: 16px; text-align: center; }
  #cringe { width: min(72vw, 320px); aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ff6b88, var(--btn) 45%, var(--btn-dark));
    box-shadow: 0 14px 0 #7a0b27, 0 24px 50px rgba(255,45,85,.35);
    color: #fff; font-size: clamp(28px, 9vw, 42px); font-weight: 900; letter-spacing: .04em;
    transition: transform .08s, box-shadow .08s; user-select: none; }
  #cringe:active { transform: translateY(10px); box-shadow: 0 4px 0 #7a0b27, 0 10px 30px rgba(255,45,85,.3); }
  #cringe:disabled { filter: grayscale(.6) brightness(.8); }
  .hint { color: var(--muted); font-size: 14px; min-height: 1.2em; }

  #stage { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity .15s; }
  #stage.on { opacity: 1; pointer-events: auto; }
  #playerWrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #playerBox { width: 100%; aspect-ratio: 16/9; max-height: 100%; }
  #playerBox iframe { width: 100%; height: 100%; border: 0; display: block; }
  #video, #embed { width: 100%; height: 100%; border: 0; display: block; object-fit: contain; background: #000; }
  .hidden { display: none !important; }
  .bar { display: flex; gap: 12px; align-items: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar .title { flex: 1; font-size: 14px; color: var(--muted); text-align: left; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .bar button { border: 0; border-radius: 999px; padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer; }
  #again { background: var(--btn); color: #fff; }
  #close { background: #2a2233; color: var(--fg); }
</style>
</head>
<body>
<main>
  <button id="cringe" disabled aria-label="Play a random cringe clip">CRINGE</button>
  <div class="hint" id="hint">Loading…</div>
</main>

<div id="stage" aria-hidden="true">
  <div id="playerWrap">
    <div id="playerBox"><div id="player"></div></div>
    <video id="video" class="hidden" playsinline preload="auto"></video>
    <iframe id="embed" class="hidden" allow="autoplay; fullscreen" title="Reddit clip"></iframe>
  </div>
  <div class="bar">
    <div class="title" id="title"></div>
    <button id="close" aria-label="Close">✕</button>
    <button id="again">Another 😬</button>
  </div>
</div>

<script src="clips.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), hint = $("hint"), video = $("video"), embed = $("embed"), box = $("playerBox");
  const MAX_SECONDS = 60;
  const nativeHls = video.canPlayType("application/vnd.apple.mpegurl") !== "";
  const redditHls = {}; // post id -> HLS playlist URL, filled in the background
  let player, ready = false, current = null, bag = [], stallTimer, hls;

  const isReddit = (c) => !!c.reddit;

  // Look up each Reddit post's video once at startup, so a tap can start it right away.
  async function resolveReddit(c) {
    try {
      const res = await fetch(`https://www.reddit.com/comments/${c.reddit}.json?raw_json=1`);
      const post = (await res.json())[0].data.children[0].data;
      const media = post.secure_media || post.media || post.crosspost_parent_list?.[0]?.secure_media;
      if (media?.reddit_video?.hls_url) redditHls[c.reddit] = media.reddit_video.hls_url;
    } catch (e) { /* falls back to Reddit's own embed player */ }
  }

  // Shuffle bag: every clip plays once before any repeats.
  function nextClip() {
    if (!bag.length) {
      bag = CLIPS.slice().sort(() => Math.random() - 0.5);
      if (current && bag[0] === current && bag.length > 1) bag.push(bag.shift());
    }
    return bag.shift();
  }

  function loadVideo(url) {
    video.dataset.src = url;
    if (hls) { hls.destroy(); hls = null; }
    if (nativeHls || !window.Hls?.isSupported()) { video.src = url; return; }
    hls = new Hls();
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) showEmbed(); });
    hls.loadSource(url);
    hls.attachMedia(video);
  }

  function cueNext() {
    current = nextClip();
    if (!isReddit(current)) {
      player.cueVideoById({ videoId: current.id, startSeconds: current.start, endSeconds: current.end });
    } else if (redditHls[current.reddit]) {
      loadVideo(redditHls[current.reddit]);
    }
  }

  function show(el) {
    for (const x of [box, video, embed]) x.classList.toggle("hidden", x !== el);
  }

  function showEmbed() {
    show(embed);
    embed.src = `https://embed.reddit.com/r/${current.sub}/comments/${current.reddit}/?embed=true&showmedia=true`;
    $("title").textContent = "Tap the video to start ▶";
  }

  // The next clip is always cued in advance, so a tap only has to call play.
  // Calling it synchronously inside the tap is what lets phones start it with sound.
  function play() {
    stage.classList.add("on");
    stage.setAttribute("aria-hidden", "false");
    $("title").textContent = current.title;
    clearTimeout(stallTimer);
    if (!isReddit(current)) {
      show(box);
      player.unMute();
      player.playVideo();
      stallTimer = setTimeout(() => {
        if (player.getPlayerState() !== YT.PlayerState.PLAYING) $("title").textContent = "Tap the video to start ▶";
      }, 2000);
    } else if (redditHls[current.reddit]) {
      // Not cued yet if the lookup finished after this clip was picked.
      if (video.dataset.src !== redditHls[current.reddit]) loadVideo(redditHls[current.reddit]);
      show(video);
      video.muted = false;
      video.currentTime = 0;
      const clip = current;
      video.play().catch(() => {
        if (clip !== current) return;
        video.controls = true; $("title").textContent = "Tap the video to start ▶";
      });
    } else {
      showEmbed();
    }
  }

  // Silence every player, so the old clip never keeps playing under the next one.
  function stopAll() {
    clearTimeout(stallTimer);
    if (player) player.stopVideo();
    video.pause();
    video.controls = false;
    embed.removeAttribute("src");
  }

  function close() {
    stopAll();
    stage.classList.remove("on");
    stage.setAttribute("aria-hidden", "true");
    cueNext();
  }

  video.addEventListener("ended", () => setTimeout(close, 600));
  video.addEventListener("timeupdate", () => { if (video.currentTime >= MAX_SECONDS) close(); });
  video.addEventListener("error", () => { if (stage.classList.contains("on") && isReddit(current)) showEmbed(); });

  $("cringe").addEventListener("click", () => ready && play());
  $("close").addEventListener("click", close);
  $("again").addEventListener("click", () => { stopAll(); cueNext(); play(); });

  CLIPS.filter(isReddit).forEach(resolveReddit);

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("player", {
      width: "100%", height: "100%",
      playerVars: { playsinline: 1, controls: 1, rel: 0, modestbranding: 1, fs: 1 },
      events: {
        onReady: () => {
          ready = true; cueNext();
          $("cringe").disabled = false; hint.textContent = "Sound on 🔊";
        },
        onStateChange: (e) => {
          if (isReddit(current)) return;
          if (e.data === YT.PlayerState.PLAYING) $("title").textContent = current.title;
          if (e.data === YT.PlayerState.ENDED) setTimeout(close, 600);
        },
        // Clip removed or embedding disabled: skip to another one.
        onError: () => { if (stage.classList.contains("on")) { cueNext(); play(); } else cueNext(); },
      },
    });
  };
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
